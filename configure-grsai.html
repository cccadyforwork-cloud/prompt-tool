<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>配置 Grsai 生图 Key</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=20261110-grsai-key-entry-52">
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); }
      .standalone-key-panel { width: min(520px, 100%); border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: var(--surface); box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35); }
      .standalone-key-back { display: inline-block; margin-top: 2px; color: var(--muted); font-size: 12px; text-decoration: none; text-align: center; }
      .standalone-key-back:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="standalone-key-panel">
      <form id="grsaiKeyForm" class="api-key-form">
        <div class="api-key-dialog-heading">
          <div><p class="eyebrow">Image Generation</p><h1 id="pageTitle">配置 Grsai 生图 Key</h1></div>
        </div>
        <p class="api-key-description">新 Key 将保存到本机 macOS 钥匙串，并立即替换当前生图服务使用的旧 Key。不会写入网页存储或 Git。</p>
        <p id="keyCurrentStatus" class="api-key-current-status" role="status">正在读取配置状态…</p>
        <label for="grsaiKeyInput">Grsai 生图 API Key</label>
        <div class="api-key-input-row">
          <input id="grsaiKeyInput" type="password" autocomplete="new-password" spellcheck="false" placeholder="sk-…" required autofocus>
          <button id="toggleKeyVisibility" class="secondary" type="button" aria-pressed="false">显示</button>
        </div>
        <p class="input-help">直接粘贴完整的 sk-… Key，也支持粘贴 GRSAI_API_KEY=… 或 Bearer … 格式。</p>
        <button id="saveGrsaiKey" type="submit">保存新 Key 并立即生效</button>
        <p id="keySaveStatus" class="status" role="status" aria-live="polite"></p>
        <a class="standalone-key-back" href="./index.html">返回提示词工具</a>
      </form>
    </main>
    <script src="./configure-grsai.js?v=20261110-1"></script>
  </body>
</html>
